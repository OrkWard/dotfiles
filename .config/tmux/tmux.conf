# theme
set -g status-style "fg=brightwhite,bg=green"
set -g status-left-length 50
set -g message-style "fg=brightwhite,bg=blue,fill=blue"
set -g message-command-style "fg=brightwhite,bg=blue,fill=blue"
set -gu prompt-cursor-colour
set -g prompt-cursor-style block
set -g mode-style "fg=brightwhite,bg=blue"
set -g copy-mode-mark-style "fg=brightwhite,bg=brightblue"
set -g copy-mode-current-match-style "fg=brightwhite,bg=blue"
set -g copy-mode-match-style "fg=brightwhite,bg=brightblue"
set -g copy-mode-position-format "#[align=right][#{copy_position}/#{copy_position_limit}]"

set -g mode-keys vi
set -g base-index 1
set -g renumber-windows on
set -g pane-base-index 1
set -s set-clipboard on

# mouse support
set -g mouse on
set -g focus-events on
set -g extended-keys on
set -g allow-passthrough on

# set prefix
set-option -g prefix F1

# cleanup
unbind C-b

# client
bind-key C-d detach-client

# travel prompt
bind-key u copy-mode\; send-keys -X previous-prompt\; send-keys -X previous-prompt
bind-key -T copy-mode-vi u send-keys -X previous-prompt
bind-key -T copy-mode-vi d send-keys -X next-prompt

# pane
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key o resize-pane -Z

# window
bind-key D split-window -c "#{pane_current_path}"
bind-key d split-window -h -c "#{pane_current_path}"
bind-key n new-window -c "~"
bind-key N new-window -c "#{pane_current_path}"
bind-key w if-shell -F '#{m/r:^-?(fish|bash|zsh|sh|dash)$,#{pane_current_command}}' 'kill-pane' 'confirm-before -p "kill-pane (#{pane_current_command})? (y/n)" kill-pane'
bind-key r command-prompt -I "#W" "rename-window -- '%%'"

# quick switch between window
bind-key 1 selectw -t 1
bind-key 2 selectw -t 2
bind-key 3 selectw -t 3
bind-key 4 selectw -t 4
bind-key 5 selectw -t 5
bind-key 6 selectw -t 6
bind-key 7 selectw -t 7
bind-key 8 selectw -t 8
bind-key 9 selectw -t 9

# session
# fzf light colors: selected line bold red, matched chars colour66
# mode-style is a window option, so it is unset again when the switcher leaves the mode
# switcher panes are marked with @switcher=p|s; pressing a key closes any open switcher,
# and opens the requested one unless it was the one just closed
bind-key p {
  if -F "#{P:#{?#{==:#{@switcher},p},1,}}" {
    run -C "#{P:#{?#{@switcher},kill-pane -t #{pane_id},}}"; set -wu mode-style
  } {
    if -F "#{P:#{?#{@switcher},1,}}" { run -C "#{P:#{?#{@switcher},kill-pane -t #{pane_id},}}"; set -wu mode-style }
    new-pane -E -x80% -y60% -X0 -Y0; move-pane -P centre; set -w mode-style fg=red,bold; set -p switch-mode-match-style fg=colour66; set -p @switcher p; run -C "set-hook -p pane-mode-changed { if -F '##{pane_in_mode}' '' { set -wu -t #{window_id} mode-style } }"; switch-mode -wk
  }
}
bind-key s {
  if -F "#{P:#{?#{==:#{@switcher},s},1,}}" {
    run -C "#{P:#{?#{@switcher},kill-pane -t #{pane_id},}}"; set -wu mode-style
  } {
    if -F "#{P:#{?#{@switcher},1,}}" { run -C "#{P:#{?#{@switcher},kill-pane -t #{pane_id},}}"; set -wu mode-style }
    new-pane -E -x80% -y60% -X0 -Y0; move-pane -P centre; set -w mode-style fg=red,bold; set -p switch-mode-match-style fg=colour66; set -p @switcher s; run -C "set-hook -p pane-mode-changed { if -F '##{pane_in_mode}' '' { set -wu -t #{window_id} mode-style } }"; switch-mode -sk
  }
}
bind-key "'" switch-client -l
# move current window into a new session named after it; the window becomes 'origin'
bind-key S run-shell -b 'set -- $(tmux new-session -dP -F "##{session_id} ##{window_id}" -s #{q:window_name}) && tmux move-window -s #{q:window_id} -t "$1:" \; kill-window -t "$2" \; rename-window -t #{q:window_id} origin \; switch-client -c #{q:client_name} -t #{q:window_id}'
bind-key C-s run-shell -b '~/.config/tmux/state.fish save #{q:client_name}'
bind-key C-r run-shell -b '~/.config/tmux/state.fish restore #{q:client_name}'
bind-key , source ~/.config/tmux/tmux.conf

# enter copy
set-hook -g pane-mode-entered 'if-shell -F "#{==:#{hook_current_mode},copy-mode}" "send-keys -X refresh-on"'
bind-key ? copy-mode\; send-keys ?
bind-key C-u copy-mode\; send-keys C-u

# copy mode
bind-key -T copy-mode-vi Escape if-shell -F '#{selection_active}' 'send -X clear-selection' 'send -X cancel'
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle

set -g @fingers-key c
set -g @fingers-hint-style "fg=green,bold"
set -g @fingers-highlight-style "fg=yellow"

run-shell ~/.config/tmux/sensible.fish
run-shell ~/.config/tmux/tmux-fingers.fish
